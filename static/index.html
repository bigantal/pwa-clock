<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>PWA clock</title>
  <meta name="description" content="A minimal full-screen clock that works offline.">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#000000">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="PWA clock">
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="favicon.ico" sizes="any">
  <link rel="apple-touch-icon" href="images/icon-180.png">
  <link rel="preload" href="fonts/ShareTechMono-Regular.ttf" as="font" type="font/ttf" crossorigin>
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="fullscreen">
  <div class="container">
    <h1 class="clock anim">--:--</h1>
  </div>
  <script src="js/main.js"></script>
</body>
</html>
